name = "pasay-cloudflare-worker"
main = "src/index.ts"
compatibility_date = "2026-08-20"
compatibility_flags = ["nodejs_compat"]

[[containers]]
class_name = "PasayContainer"
image = "../Dockerfile"
max_instances = 1
instance_type = "basic"
region = "APAC"

[[durable_objects.bindings]]
class_name = "PasayContainer"
name = "PASAY_CONTAINER"

[[migrations]]
tag = "v1-pasay-container"
new_sqlite_classes = ["PasayContainer"]

[[queues.producers]]
queue = "pasay-events"
binding = "PASAY_QUEUE"

[[queues.consumers]]
queue = "pasay-events"
max_batch_size = 10
max_batch_timeout = 1
max_retries = 5
dead_letter_queue = "pasay-events-dlq"

[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true
head_sampling_rate = 1
