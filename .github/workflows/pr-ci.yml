name: pasay-gate

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: pasay-gate-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pasay-gate:
    name: pasay-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ""
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: changed
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          files="$(git diff --name-only "$base" "$head")"
          {
            echo "changed_files<<EOF"
            printf '%s\n' "$files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if printf '%s\n' "$files" | grep -Eq '^(app/|alembic/|tests/|requirements\.txt|pytest\.ini|docker-compose\.yml|Dockerfile|scripts/)'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

          if printf '%s\n' "$files" | grep -Eq '^(pasay-telegram-bot/)'; then
            echo "bot=true" >> "$GITHUB_OUTPUT"
          else
            echo "bot=false" >> "$GITHUB_OUTPUT"
          fi

          if printf '%s\n' "$files" | grep -Eq '^(cloudflare-worker/)'; then
            echo "cloudflare=true" >> "$GITHUB_OUTPUT"
          else
            echo "cloudflare=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify GitHub workflow files
        run: |
          test -f AGENTS.md
          test -f .github/ISSUE_TEMPLATE/ai-task.yml
          test -f .github/ISSUE_TEMPLATE/config.yml
          test -f .github/PULL_REQUEST_TEMPLATE.md
          test -f .github/workflows/pr-ci.yml
          test -f GITHUB_DEV_WORKFLOW.md

      - name: Verify workflow contract text
        run: |
          grep -q "dev" .github/ISSUE_TEMPLATE/ai-task.yml
          grep -q "design-dev" .github/ISSUE_TEMPLATE/ai-task.yml
          grep -q "Linked Issue" .github/PULL_REQUEST_TEMPLATE.md
          grep -q "READY_FOR_OWNER" .github/PULL_REQUEST_TEMPLATE.md
          grep -q "route:dev" GITHUB_DEV_WORKFLOW.md
          grep -q "ready-for-owner" GITHUB_DEV_WORKFLOW.md
          grep -q "CodeRabbit and \`pasay-gate\` run in parallel" GITHUB_DEV_WORKFLOW.md
          grep -q "Permanent Engineering Truths" AGENTS.md
          grep -q "GitHub Issue 是唯一任务 ID" README.md
          grep -q "pasay-gate" README.md

      - name: Set up Python
        if: steps.changed.outputs.backend == 'true' || steps.changed.outputs.bot == 'true' || steps.changed.outputs.cloudflare == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        if: steps.changed.outputs.backend == 'true' || steps.changed.outputs.cloudflare == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run backend import smoke
        if: steps.changed.outputs.backend == 'true'
        run: |
          python -c "import app.main, fastapi, alembic, sqlalchemy; print('BACKEND_IMPORT_SMOKE_OK')"

      - name: Run backend targeted pytest (Issue #18 + Issue #31 + M1 + M002 + M003 + M005 RET3 cross-org)
        if: steps.changed.outputs.backend == 'true' || steps.changed.outputs.cloudflare == 'true'
        env:
          DATABASE_URL: "postgresql+psycopg2://postgres:postgres@localhost:5432/postgres"
          DATABASE_URL_UNPOOLED: "postgresql+psycopg2://postgres:postgres@localhost:5432/postgres"
          PASAY_TEST_DB_NAME: "pasay_pm_ci_${{ github.run_id }}_001"
          TELEGRAM_BOT_TOKEN: "fake-token-for-ci-pass-12345"
          TELEGRAM_WEBHOOK_SECRET: "fake-webhook-secret-for-ci"
          PASAY_CONTAINER_INGEST_TOKEN: "fake-ingest-token-for-ci"
          PASAY_RUNTIME_MODE: "ci"
        timeout-minutes: 40
        run: |
          # Legacy P0 gates: Issue #18 (telegram webhook) + Issue #31 (prod arch closeout)
          # M1 org-scope P0 regression (milestone/1)
          # M002: Rent closure + Repair closure + Expense payment truth + Repair AI employee
          # M003: Expense Truth Closure + Reports/Operations/Legacy Scope Unified Hardening
          # M005: RETURN-3 SEC-ADDENDUM — payments matcher + commission settlement cross-org
          #       strong counterexamples (real PG16 CI execution)
          python -m pytest \
            tests/test_telegram_webhook_p018.py \
            tests/test_prod_arch_closeout_p0_031.py \
            tests/test_milestone_1_org_scope_p0.py \
            tests/test_expense_003b_payment_truth.py \
            tests/test_repair_ai_employee_008.py \
            tests/test_rent_closure_m2.py \
            tests/test_repair_closure_m2.py \
            tests/test_fix3_blockers_m2.py \
            tests/test_m003_expense_scope_hardening.py \
            tests/test_m005_ret3_cross_org_coverage.py \
            -v --tb=short -q

      - name: Install bot dependencies
        if: steps.changed.outputs.bot == 'true'
        working-directory: pasay-telegram-bot
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run bot import smoke
        if: steps.changed.outputs.bot == 'true'
        working-directory: pasay-telegram-bot
        run: |
          python -c "import pasay_bot.main, telegram, httpx; print('BOT_IMPORT_SMOKE_OK')"

      - name: Set up Node.js (Cloudflare Worker TS Gate)
        if: steps.changed.outputs.cloudflare == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: cloudflare-worker/package-lock.json

      - name: Cloudflare Worker — verify Node engine gate
        if: steps.changed.outputs.cloudflare == 'true'
        working-directory: cloudflare-worker
        run: |
          node -e "const v=process.versions.node.split('.').map(Number); if(v[0]<22){console.error('NODE_VERSION_TOO_OLD:', process.version); process.exit(1);} console.log('NODE_VERSION_OK:', process.version)"

      - name: Cloudflare Worker — install dependencies (strict lockfile)
        if: steps.changed.outputs.cloudflare == 'true'
        working-directory: cloudflare-worker
        run: |
          npm ci --no-audit --no-fund

      - name: Cloudflare Worker — typecheck gate (real src + mock tests, separate tsconfigs)
        if: steps.changed.outputs.cloudflare == 'true'
        working-directory: cloudflare-worker
        run: |
          # (1) REAL build — no mock paths, use the PUBLISHED @cloudflare/containers
          # 0.3.7 types directly.  This FAILS CLOSED if the src code imports or
          # declares types incompatible with the REAL npm package (earlier
          # versions of tsconfig.json pointed @cloudflare/containers at a local
          # mock, giving a false-green typecheck).
          npm run types:src
          # (2) TEST build — with paths mock, so the test-only import graph
          # resolves @cloudflare/containers through ./tests/mock_containers.ts
          # (the runtime platform is absent during `npx tsx` on the host).
          npm run types:tests

      - name: Cloudflare Worker — TS spec runner (real handler E2E, with paths mock)
        if: steps.changed.outputs.cloudflare == 'true'
        working-directory: cloudflare-worker
        run: |
          # Spec runtime MUST point tsconfig at the tests tsconfig so the
          # @cloudflare/containers paths alias resolves to the mock (the
          # real package cannot be loaded in Node.js because it imports
          # the Cloudflare-only virtual module "cloudflare:workers").
          npx tsx --tsconfig tsconfig.tests.json tests/index.spec.ts

  m004-gate:
    name: m004-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ""
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed files (backend scope)
        id: changed
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if [ -z "$base" ] || [ -z "$head" ]; then
            backend=true
          else
            files="$(git diff --name-only "$base" "$head")"
            backend=false
            while IFS= read -r f; do
              case "$f" in
                .github/workflows/*|app/*|alembic/*|tests/*|requirements*.txt|pyproject.toml|setup.py|conftest.py)
                  backend=true
                  ;;
              esac
            done <<< "$files"
          fi
          echo "backend=$backend" >> $GITHUB_OUTPUT

      - name: Set up Python 3.11
        if: steps.changed.outputs.backend == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        if: steps.changed.outputs.backend == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: M004 Gate — exact 6 tests (0 FAIL / 0 ERROR contract)
        if: steps.changed.outputs.backend == 'true'
        timeout-minutes: 28
        env:
          DATABASE_URL: "postgresql+psycopg2://postgres:postgres@localhost:5432/postgres"
          DATABASE_URL_UNPOOLED: "postgresql+psycopg2://postgres:postgres@localhost:5432/postgres"
          PASAY_TEST_DB_NAME: "pasay_pm_test_m004"
          PASAY_RT_DB_NAME: "pasay_pm_test_rt"
          PASAY_RT_DB_URL: "postgresql+psycopg2://postgres:postgres@localhost:5432/postgres"
          PASAY_RT_ADMIN_DB_OVERRIDE: "postgresql+psycopg2://postgres:postgres@localhost:5432/postgres"
          TELEGRAM_BOT_TOKEN: "fake-token-for-ci-pass-12345"
          TELEGRAM_WEBHOOK_SECRET: "fake-webhook-secret-for-ci"
          PASAY_CONTAINER_INGEST_TOKEN: "fake-ingest-token-for-ci"
          PASAY_RUNTIME_MODE: "ci"
          OPERATIONS_DEFAULT_ASSIGNEE: "1"
        run: |
          python -m pytest \
            tests/test_m004_lease_moveout_truth_closure.py \
            tests/test_m004_db_invariants.py \
            tests/test_m004_db_invariants_renewal_lifecycle.py \
            tests/test_m004_concurrency.py \
            tests/test_leases.py \
            tests/test_m003_operations_truth_closure.py \
            -q -p no:cacheprovider --tb=short \
            --ignore=eval

  # ----------------------------------------------------------------------
  # Issue #65 — PASAY-CI-ALEMBIC-SAFETY-P0-001
  # Migration Graph Gate + Safe Generation Helper + Fresh PostgreSQL
  # `alembic upgrade head` truth gate. Triggers when migration files,
  # safety scripts/fixtures, or this workflow file change.
  # ----------------------------------------------------------------------
  alembic-safety-gate:
    name: alembic-safety-gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: ""
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed files (alembic + safety gate scope)
        id: changed
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if [ -z "$base" ] || [ -z "$head" ]; then
            relevant=true
          else
            files="$(git diff --name-only "$base" "$head")"
            relevant=false
            while IFS= read -r f; do
              case "$f" in
                alembic/*|scripts/wf/alembic_*.py|scripts/wf/alembic_fixtures/*|scripts/wf/test_alembic_*.py|.github/workflows/pr-ci.yml)
                  relevant=true
                  ;;
              esac
            done <<< "$files"
          fi
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"

      - name: Set up Python 3.11
        if: steps.changed.outputs.relevant == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        if: steps.changed.outputs.relevant == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Alembic Graph Gate — static + ScriptDirectory authority
        if: steps.changed.outputs.relevant == 'true'
        shell: bash
        run: |
          # Hard gate: gate exits 1 on FAIL → workflow step fails the job.
          python scripts/wf/alembic_graph_gate.py \
            --script-location alembic \
            --allow-multi-head-file scripts/wf/alembic_allow_multi_head.txt

      - name: Alembic Safe-Create Helper — read real head smoke test
        if: steps.changed.outputs.relevant == 'true'
        shell: bash
        run: |
          # Dry-run reads the current head and refuses to create anything if
          # the graph is broken. Exit 0 = real head readable.
          python scripts/wf/alembic_safe_create.py \
            --script-location alembic \
            --message "issue-65-dry-run-smoke" \
            --dry-run

      - name: Alembic — Fresh PostgreSQL `alembic upgrade head` truth gate
        if: steps.changed.outputs.relevant == 'true'
        env:
          # Empty DB on a fresh service. `alembic upgrade heads` (plural)
          # applies ALL heads from scratch, which is what we want when the
          # repository legitimately has 2+ heads (the graph gate's allow-list
          # already confirms both are intentional). `alembic upgrade head`
          # (singular) refuses to choose among multiple heads.
          DATABASE_URL: "postgresql+psycopg2://postgres:postgres@localhost:5432/postgres"
          DATABASE_URL_UNPOOLED: "postgresql+psycopg2://postgres:postgres@localhost:5432/postgres"
          TELEGRAM_BOT_TOKEN: "fake-token-for-ci-pass-12345"
          TELEGRAM_WEBHOOK_SECRET: "fake-webhook-secret-for-ci"
          PASAY_CONTAINER_INGEST_TOKEN: "fake-ingest-token-for-ci"
          PASAY_RUNTIME_MODE: "ci"
          OPERATIONS_DEFAULT_ASSIGNEE: "1"
        timeout-minutes: 15
        run: |
          set -euo pipefail
          # The default alembic_version table is VARCHAR(32); that is too
          # narrow for our long revision ids (e.g.
          # `20260827_160000_return1_postgres_bot_state` is 41 chars). Pre-
          # create the table with VARCHAR(255) on the empty DB so alembic
          # picks up the wider column. This is a CI-only workaround and does
          # NOT modify any migration file. The M006 migration is intentionally
          # preserved per Issue #65 Forbidden Paths.
          echo "=== pre-create alembic_version (CI-only workaround) ==="
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
            CREATE TABLE IF NOT EXISTS alembic_version (version_num VARCHAR(255) NOT NULL);
          SQL
          echo "=== alembic upgrade heads on fresh PostgreSQL ==="
          python -m alembic upgrade heads
          echo "=== alembic current (must equal HEAD revisions) ==="
          python -m alembic current
          echo "=== alembic heads (must match graph gate output) ==="
          python -m alembic heads
          echo "=== graph gate re-check on the freshly-upgraded repo ==="
          python scripts/wf/alembic_graph_gate.py \
            --script-location alembic \
            --allow-multi-head-file scripts/wf/alembic_allow_multi_head.txt

      - name: Alembic Safety Gate — targeted pytest suites
        if: steps.changed.outputs.relevant == 'true'
        timeout-minutes: 10
        run: |
          python -m pytest \
            scripts/wf/test_alembic_graph_gate.py \
            scripts/wf/test_alembic_safe_create.py \
            -v --tb=short -q
