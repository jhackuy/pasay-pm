name: pasay-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pasay-gate-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pasay-gate:
    name: pasay-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ""
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          files="$(git diff --name-only "$base" "$head")"
          backend=false; bot=false; worker=false
          printf '%s\n' "$files" | grep -Eq '^(app/|alembic/|tests/|requirements\.txt|pytest\.ini|Dockerfile|scripts/)' && backend=true || true
          printf '%s\n' "$files" | grep -Eq '^pasay-telegram-bot/' && bot=true || true
          printf '%s\n' "$files" | grep -Eq '^cloudflare-worker/' && worker=true || true
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "bot=$bot" >> "$GITHUB_OUTPUT"
          echo "worker=$worker" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.changed.outputs.backend == 'true' || steps.changed.outputs.bot == 'true' || steps.changed.outputs.worker == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Backend tests
        if: steps.changed.outputs.backend == 'true' || steps.changed.outputs.worker == 'true'
        env:
          DATABASE_URL: "postgresql+psycopg2://postgres:postgres@localhost:5432/postgres"
          DATABASE_URL_UNPOOLED: "postgresql+psycopg2://postgres:postgres@localhost:5432/postgres"
          PASAY_TEST_DB_NAME: "pasay_pm_ci_${{ github.run_id }}"
          TELEGRAM_BOT_TOKEN: "fake-token-for-ci"
          TELEGRAM_WEBHOOK_SECRET: "fake-webhook-secret-for-ci"
          PASAY_CONTAINER_INGEST_TOKEN: "fake-ingest-token-for-ci"
          PASAY_RUNTIME_MODE: "ci"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -c "import app.main, fastapi, alembic, sqlalchemy; print('BACKEND_IMPORT_OK')"
          python -m pytest \
            tests/test_telegram_webhook_p018.py \
            tests/test_milestone_1_org_scope_p0.py \
            tests/test_expense_003b_payment_truth.py \
            tests/test_rent_closure_m2.py \
            tests/test_repair_closure_m2.py \
            tests/test_m003_expense_scope_hardening.py \
            tests/test_m004_lease_moveout_truth_closure.py \
            tests/test_m005_ret3_cross_org_coverage.py \
            -q --tb=short

      - name: Bot tests
        if: steps.changed.outputs.bot == 'true'
        working-directory: pasay-telegram-bot
        run: |
          python -m pip install -e ".[dev]"
          python -c "import pasay_bot.main, telegram, httpx; print('BOT_IMPORT_OK')"
          python -m pytest tests -q --tb=short

      - name: Set up Node.js
        if: steps.changed.outputs.worker == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare-worker/package-lock.json

      - name: Worker checks
        if: steps.changed.outputs.worker == 'true'
        working-directory: cloudflare-worker
        run: |
          npm ci --no-audit --no-fund
          npm run types:src
          npm run types:tests
          npm test
