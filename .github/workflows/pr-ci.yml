name: Pasay PR CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

jobs:
  workflow-contract:
    name: Workflow Contract Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify GitHub workflow files
        run: |
          test -f .github/ISSUE_TEMPLATE/ai-task.yml
          test -f .github/ISSUE_TEMPLATE/config.yml
          test -f .github/PULL_REQUEST_TEMPLATE.md
          test -f .github/workflows/pr-ci.yml
          test -f GITHUB_DEV_WORKFLOW.md

      - name: Verify workflow contract text
        run: |
          grep -q "Task ID / Title" .github/ISSUE_TEMPLATE/ai-task.yml
          grep -q "Linked Issue" .github/PULL_REQUEST_TEMPLATE.md
          grep -q "READY_FOR_OWNER" .github/PULL_REQUEST_TEMPLATE.md
          grep -q "GitHub Issue is the single task ID" GITHUB_DEV_WORKFLOW.md
          grep -q "GitHub Issue 是唯一任务 ID" README.md

  backend-import-smoke:
    name: Backend Import Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run backend import smoke
        run: |
          python -c "import app.main, fastapi, alembic, sqlalchemy; print('BACKEND_IMPORT_SMOKE_OK')"

  bot-import-smoke:
    name: Telegram Bot Import Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ""
    defaults:
      run:
        working-directory: pasay-telegram-bot
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bot dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run bot import smoke
        run: |
          python -c "import pasay_bot.main, telegram, httpx; print('BOT_IMPORT_SMOKE_OK')"
