name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /opencode') ||
      startsWith(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Create PASAY OpenCode GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PASAY_OPENCODE_APP_CLIENT_ID }}
          private-key: ${{ secrets.PASAY_OPENCODE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure repository-local git identity
        shell: bash
        run: |
          git config --local user.name "pasay-opencode-bot"
          git config --local user.email "pasay-opencode-bot@users.noreply.github.com"

      - name: Verify clean worktree
        shell: bash
        run: test -z "$(git status --porcelain)"

      - name: Run opencode
        uses: anomalyco/opencode/github@2c14fc5586fe0b88e5c04732d2e846769cc35671
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        with:
          use_github_token: true
          model: minimax/MiniMax-M3
