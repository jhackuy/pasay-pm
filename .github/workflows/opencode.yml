name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Owner commands are the only actionable entry point. A command must be the
# first token of the comment; merely mentioning /oc or /opencode in prose must
# never spend model tokens. Bot/non-command runs use unique groups and cannot
# cancel real work. Keep Builder authority below workflow/secrets/deploy authority.
concurrency:
  group: >-
    ${{ github.event.comment.user.type != 'Bot' &&
        github.event.comment.author_association == 'OWNER' &&
        (github.event.comment.body == '/oc' ||
         startsWith(github.event.comment.body, '/oc ') ||
         startsWith(github.event.comment.body, '/oc\n') ||
         github.event.comment.body == '/opencode' ||
         startsWith(github.event.comment.body, '/opencode ') ||
         startsWith(github.event.comment.body, '/opencode\n')) &&
        format('opencode-{0}', github.event.issue.number || github.event.pull_request.number || github.run_id) ||
        format('opencode-ignored-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  opencode:
    if: |
      github.event.comment.user.type != 'Bot' &&
      github.event.comment.author_association == 'OWNER' &&
      (github.event.comment.body == '/oc' ||
       startsWith(github.event.comment.body, '/oc ') ||
       startsWith(github.event.comment.body, '/oc\n') ||
       github.event.comment.body == '/opencode' ||
       startsWith(github.event.comment.body, '/opencode ') ||
       startsWith(github.event.comment.body, '/opencode\n'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      XDG_DATA_HOME: /tmp/opencode-data-${{ github.run_id }}-${{ github.run_attempt }}
      XDG_CACHE_HOME: /tmp/opencode-cache-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Create PASAY OpenCode GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PASAY_OPENCODE_APP_CLIENT_ID }}
          private-key: ${{ secrets.PASAY_OPENCODE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1
          persist-credentials: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure repository-local git identity
        shell: bash
        run: |
          set -euo pipefail
          git config --local user.name "pasay-opencode-bot"
          git config --local user.email "pasay-opencode-bot@users.noreply.github.com"

      - name: Verify required secrets and clean worktree
        shell: bash
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${MINIMAX_API_KEY:-}"
          test -z "$(git status --porcelain)"
          mkdir -p "$XDG_DATA_HOME" "$XDG_CACHE_HOME"

      - name: Install verified OpenCode V1 runtime
        shell: bash
        env:
          OPENCODE_VERSION: '1.18.24'
          OPENCODE_ASSET_SHA256: '573e48cd095670bf87dd834442077800b4bc979d0ad7d8b19802ec2b73e90c54'
        run: |
          set -euo pipefail
          archive="/tmp/opencode-linux-x64.tar.gz"
          dist="/tmp/opencode-dist"
          curl -fsSL "https://github.com/anomalyco/opencode/releases/download/v${OPENCODE_VERSION}/opencode-linux-x64.tar.gz" -o "$archive"
          printf '%s  %s\n' "$OPENCODE_ASSET_SHA256" "$archive" | sha256sum -c -
          rm -rf "$dist"
          mkdir -p "$dist" "$HOME/.opencode/bin"
          tar -xzf "$archive" -C "$dist"
          bin="$(find "$dist" -type f -name opencode -print -quit)"
          test -n "$bin"
          install -m 0755 "$bin" "$HOME/.opencode/bin/opencode"
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          "$HOME/.opencode/bin/opencode" --version
          test "$("$HOME/.opencode/bin/opencode" --version | tr -d '[:space:]')" = "$OPENCODE_VERSION"

      - name: Verify effective OpenCode routing and headless permissions
        shell: bash
        env:
          OPENCODE_CONFIG_CONTENT: '{"default_agent":"pasay-lead"}'
        run: |
          set -euo pipefail
          opencode debug config > /tmp/opencode-effective-config.json
          python - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path('/tmp/opencode-effective-config.json').read_text())
          assert cfg.get('default_agent') == 'pasay-lead', cfg.get('default_agent')
          assert cfg.get('share') == 'disabled', cfg.get('share')
          assert cfg.get('subagent_depth') == 1, cfg.get('subagent_depth')
          agents = cfg.get('agent') or {}
          lead = agents.get('pasay-lead') or {}
          assert lead.get('mode') == 'primary', lead.get('mode')
          permissions = lead.get('permission') or {}
          assert permissions.get('edit') == 'allow', permissions.get('edit')
          assert permissions.get('bash') == 'allow', permissions.get('bash')
          def walk(v, path='permission'):
              if isinstance(v, dict):
                  for k, x in v.items(): walk(x, f'{path}.{k}')
              elif isinstance(v, list):
                  for i, x in enumerate(v): walk(x, f'{path}[{i}]')
              elif isinstance(v, str) and v.lower() == 'ask':
                  raise AssertionError(f'headless permission cannot be ask: {path}')
          walk(permissions)
          prompt = lead.get('prompt') or ''
          assert 'PASAY-OC-QUAL-001' not in prompt
          assert 'never edits the repository directly' not in prompt.lower()
          PY

      - name: Run OpenCode GitHub handler with PASAY Lead
        shell: bash
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MODEL: minimax/MiniMax-M3
          SHARE: 'false'
          USE_GITHUB_TOKEN: 'true'
          OPENCODE_CONFIG_CONTENT: '{"default_agent":"pasay-lead"}'
        run: |
          set -euo pipefail
          opencode github run

      - name: Guard Builder workflow boundary and capture recovery patch
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/opencode-recovery
          git status --porcelain=v1 > /tmp/opencode-recovery/status.txt
          git diff --binary > /tmp/opencode-recovery/worktree.patch
          git diff --cached --binary > /tmp/opencode-recovery/index.patch
          git diff --name-only HEAD > /tmp/opencode-recovery/changed-files.txt
          git ls-files --others --exclude-standard > /tmp/opencode-recovery/untracked-files.txt
          if grep -q '^\.github/workflows/' /tmp/opencode-recovery/changed-files.txt /tmp/opencode-recovery/untracked-files.txt; then
            echo 'Builder modified .github/workflows/**; refusing to treat run as valid.' >&2
            exit 1
          fi

      - name: Upload OpenCode recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/opencode-recovery/
          if-no-files-found: warn
          retention-days: 7

      - name: Record exact OpenCode runtime version evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          command -v opencode
          opencode --version
