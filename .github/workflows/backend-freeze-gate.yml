name: backend-freeze-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch: {}

concurrency:
  group: backend-freeze-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-freeze-gate:
    # Keep the legacy check-context name because the repository ruleset currently requires it.
    name: backend-freeze-gate (17 doors, 4 stages)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Fresh PostgreSQL migration
        env:
          DATABASE_URL: "postgresql+psycopg2://postgres:postgres@localhost:5432/pasay_freeze_${{ github.run_id }}"
          DATABASE_URL_UNPOOLED: "postgresql+psycopg2://postgres:postgres@localhost:5432/pasay_freeze_${{ github.run_id }}"
        run: |
          set -euo pipefail
          export PGPASSWORD=postgres
          DB="pasay_freeze_${GITHUB_RUN_ID}"
          createdb -h localhost -U postgres "$DB"
          alembic upgrade head
          head="$(psql -At -h localhost -U postgres -d "$DB" -c 'select version_num from alembic_version limit 1;')"
          test -n "$head"
          echo "ALEMBIC_HEAD=$head"

      - name: Build backend image
        run: docker build -t "pasay-freeze:${GITHUB_RUN_ID}" .

      - name: Container startup and health
        env:
          TELEGRAM_BOT_TOKEN: fake-token
          TELEGRAM_WEBHOOK_SECRET: fake-webhook-secret
          CONTAINER_INGEST_TOKEN: fake-ingest-token
        run: |
          set -euo pipefail
          export PGPASSWORD=postgres
          DB="pasay_freeze_runtime_${GITHUB_RUN_ID}"
          createdb -h localhost -U postgres "$DB"
          URL="postgresql+psycopg2://postgres:postgres@host.docker.internal:5432/$DB"
          docker run -d \
            --name "pasay-freeze-${GITHUB_RUN_ID}" \
            --add-host=host.docker.internal:host-gateway \
            -p 18000:8000 \
            -e DATABASE_URL="$URL" \
            -e DATABASE_URL_UNPOOLED="$URL" \
            -e TELEGRAM_BOT_TOKEN="$TELEGRAM_BOT_TOKEN" \
            -e TELEGRAM_WEBHOOK_SECRET="$TELEGRAM_WEBHOOK_SECRET" \
            -e CONTAINER_INGEST_TOKEN="$CONTAINER_INGEST_TOKEN" \
            -e PASAY_RUNTIME_MODE=cloudflare-container \
            "pasay-freeze:${GITHUB_RUN_ID}"

          trap 'docker logs "pasay-freeze-${GITHUB_RUN_ID}" || true; docker rm -f "pasay-freeze-${GITHUB_RUN_ID}" >/dev/null 2>&1 || true' EXIT

          ok=0
          for i in $(seq 1 30); do
            code="$(curl -s -o /tmp/health.json -w '%{http_code}' http://127.0.0.1:18000/health || true)"
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 2
          done
          test "$ok" = "1"

          head="$(psql -At -h localhost -U postgres -d "$DB" -c 'select version_num from alembic_version limit 1;')"
          test -n "$head"

          unauth="$(curl -s -o /tmp/ingest.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{"envelope_version":1,"payload_type":"telegram","payload":{}}' http://127.0.0.1:18000/internal/ingest)"
          test "$unauth" = "401"
