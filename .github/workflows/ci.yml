name: rewrite-ci

on:
  pull_request:
    branches: [feature/telegram-ui-v2]
  push:
    branches: [feature/telegram-ui-v2]

concurrency:
  group: rewrite-ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pasay
          POSTGRES_PASSWORD: pasay
          POSTGRES_DB: pasay
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pasay -d pasay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg2://pasay:pasay@localhost:5432/pasay
      PYTHONPATH: ${{ github.workspace }}/pasay-telegram-bot
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Backend pytest
        run: >-
          pytest -vv -s
          -o faulthandler_timeout=60
          --durations=20
          tests/test_v1_*.py
      - name: Telegram adapter regressions
        working-directory: pasay-telegram-bot
        run: pytest -q tests/test_v1_adapter_regressions.py
      - name: Telegram group silence and business intent
        working-directory: pasay-telegram-bot
        run: pytest -q tests/test_group_silence_and_intent.py
      - name: Telegram button determinism
        working-directory: pasay-telegram-bot
        run: pytest -q tests/test_button_determinism.py
      - name: Telegram 3x2 UX contract
        working-directory: pasay-telegram-bot
        run: >-
          pytest -q tests/test_ux_freeze_v1_polish_targeted.py
          -k "fixed_menu_is_3x2 or group_menu_is_3x2"

  fresh-postgres-alembic:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pasay
          POSTGRES_PASSWORD: pasay
          POSTGRES_DB: pasay
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pasay -d pasay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg2://pasay:pasay@localhost:5432/pasay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Alembic upgrade/downgrade round-trip
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head

  build-core-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Backend import smoke
        run: python -c "from app.main import app; assert app is not None"
      - name: Container build
        run: docker build -t pasay-rewrite .
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Mini App build + JSDOM smoke
        working-directory: mini_app
        run: |
          npm ci
          npm run build
          test -s dist/index.html
          npm run test:smoke
      - name: Install Playwright Chromium browser
        working-directory: mini_app
        run: npx --yes playwright@1.48.2 install --with-deps chromium
      - name: Mini App real-browser smoke (Playwright)
        working-directory: mini_app
        run: npm run test:browser
