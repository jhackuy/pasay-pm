name: opencode-dispatch-bridge-retired

# Retired compatibility workflow.
# Native PASAY dispatch now uses opencode-dispatch-direct.yml directly.
# Keep this manual-only so issue labels/assignments cannot create bot-authored /oc
# comments and re-enter the legacy opencode.yml handler.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Explain retirement
        run: |
          echo 'RETIRED: use opencode-dispatch-direct.yml with the opencode-dispatch label.'
