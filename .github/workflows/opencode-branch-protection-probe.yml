name: opencode-branch-protection-probe

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [feature/telegram-ui-v2]
    paths:
      - .github/workflows/opencode-branch-protection-probe.yml

concurrency:
  group: opencode-branch-protection-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    if: github.head_ref == 'chore/pasay-gov-77-probe' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create PASAY OpenCode GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PASAY_OPENCODE_APP_CLIENT_ID }}
          private-key: ${{ secrets.PASAY_OPENCODE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Checkout probe branch with App identity
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1
          persist-credentials: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Verify effective GitHub server-side boundary
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: feature/telegram-ui-v2
          RULESET_NAME: protect-default
          PROBE_BRANCH: chore/pasay-gov-77-server-probe-target
        run: |
          set -euo pipefail
          mkdir -p artifacts/gov-77

          api="https://api.github.com/repos/${REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          curl --fail-with-body -sS "${auth[@]}" \
            "${api}/rulesets" > artifacts/gov-77/rulesets.json

          ruleset_id="$(jq -r --arg name "$RULESET_NAME" '.[] | select(.name == $name and .enforcement == "active") | .id' artifacts/gov-77/rulesets.json | head -n1)"
          test -n "$ruleset_id"

          curl --fail-with-body -sS "${auth[@]}" \
            "${api}/rulesets/${ruleset_id}" > artifacts/gov-77/ruleset-detail.json

          curl --fail-with-body -sS "${auth[@]}" \
            "${api}/rules/branches/${DEFAULT_BRANCH}" > artifacts/gov-77/effective-rules.json

          # Assert the same OpenCode App identity cannot bypass this active default-branch ruleset.
          jq -e '
            .enforcement == "active" and
            .target == "branch" and
            (.conditions.ref_name.include | index("~DEFAULT_BRANCH")) != null and
            (.bypass_actors | length) == 0 and
            .current_user_can_bypass == "never"
          ' artifacts/gov-77/ruleset-detail.json >/dev/null

          # Assert the default branch is effectively governed by PR-only, deletion protection,
          # non-fast-forward protection, and the two deterministic required checks.
          jq -e '
            ([.[].type] | index("deletion")) != null and
            ([.[].type] | index("non_fast_forward")) != null and
            ([.[].type] | index("pull_request")) != null and
            ([.[].type] | index("required_status_checks")) != null
          ' artifacts/gov-77/effective-rules.json >/dev/null

          jq -e '
            [ .[] | select(.type == "required_status_checks") | .parameters.required_status_checks[].context ] as $checks |
            ($checks | index("pasay-gate")) != null and
            ($checks | index("backend-freeze-gate (17 doors, 4 stages)")) != null
          ' artifacts/gov-77/effective-rules.json >/dev/null

          # Preserve normal OpenCode implementation capability on a non-protected feature ref.
          set +e
          git push --dry-run origin "HEAD:refs/heads/${PROBE_BRANCH}" > artifacts/gov-77/feature-branch.txt 2>&1
          feature_rc=$?
          set -e
          printf 'RULESET_ID=%s\nFEATURE_BRANCH_RC=%s\n' "$ruleset_id" "$feature_rc" | tee artifacts/gov-77/result.txt

          if [ "$feature_rc" -ne 0 ]; then
            echo 'FEATURE_BRANCH_FAIL: OpenCode App cannot write a normal feature branch.' >&2
            exit 1
          fi

          echo 'HARD_BOUNDARY_PASS: GitHub reports active effective PR-only/default-branch rules, required checks, and no App bypass; normal feature branch remains writable.' | tee -a artifacts/gov-77/result.txt

      - name: Upload governance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pasay-gov-77-branch-protection-evidence
          path: artifacts/gov-77/
          if-no-files-found: error
