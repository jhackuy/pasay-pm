name: cf-smoke-deploy

# PASAY-CLOUDFLARE-ENV-001C deployment-readiness CI.
#
# This workflow only deploys the ISOLATED smoke Worker in `cf-smoke/`.
# It does NOT touch FastAPI / Telegram bot / Postgres / production routes.
#
# Required GitHub Actions secrets (Owner-bound):
#   CLOUDFLARE_API_TOKEN  - scoped to Workers Scripts:Edit on the smoke account
#   CLOUDFLARE_ACCOUNT_ID - the smoke Cloudflare account id, exactly 32
#                           lowercase hex chars. The workflow validates the
#                           format up front and fails fast on any deviation;
#                           no /accounts discovery fallback.
#
# Trigger: `workflow_dispatch` only (real-account deploys are always
# Owner-initiated).

on:
  workflow_dispatch:

concurrency:
  group: cf-smoke-deploy
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cf-smoke
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler + jq
        run: |
          npm install --no-save wrangler@^4.123.0
          sudo apt-get update -y >/dev/null 2>&1 || true
          sudo apt-get install -y jq >/dev/null 2>&1 || apt-get install -y jq || true
          command -v jq && jq --version

      - name: Validate CLOUDFLARE_ACCOUNT_ID (fail fast)
        id: account
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eo pipefail
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not bound; expected exactly 32 lowercase hex chars"
            exit 1
          fi
          CLEAN=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '\r\n' | sed -E 's/^["'"'"']+|["'"'"']+$//g' | xargs)
          if ! printf '%s' "$CLEAN" | grep -Eq '^[a-f0-9]{32}$'; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is malformed; expected ^[a-f0-9]{32}$ (32 lowercase hex chars), got raw_len=${#CLOUDFLARE_ACCOUNT_ID} clean_len=${#CLEAN}"
            exit 1
          fi
          echo "CLOUDFLARE_ACCOUNT_ID format OK (32 lowercase hex chars)"
          echo "account_id=$CLEAN" >> "$GITHUB_OUTPUT"

      - name: Read workers.dev subdomain (GET only)
        id: subdomain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -eo pipefail
          ACC="${{ steps.account.outputs.account_id }}"
          GET=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/subdomain")
          if ! printf '%s' "$GET" | jq -e '.success == true' >/dev/null; then
            echo "::error::GET /workers/subdomain failed:"
            printf '%s\n' "$GET"
            exit 1
          fi
          SUBDOMAIN=$(printf '%s' "$GET" | jq -r '.result.subdomain // empty')
          if [ -z "$SUBDOMAIN" ]; then
            echo "::error::workers.dev subdomain not registered on account $ACC; register it once via the Cloudflare dashboard or via 'wrangler login' before re-running"
            exit 1
          fi
          echo "workers.dev subdomain: $SUBDOMAIN"
          echo "subdomain=$SUBDOMAIN" >> "$GITHUB_OUTPUT"

      - name: Dry-run compile (always)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.account_id }}
        run: npx wrangler deploy -c wrangler.toml --dry-run --env=""

      - name: Deploy smoke Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.account_id }}
        run: |
          set -eo pipefail
          npx wrangler deploy -c wrangler.toml --env="" 2>&1 | tee "$GITHUB_WORKSPACE/wrangler-deploy.log"
          ACC="${{ steps.account.outputs.account_id }}"
          SUB="${{ steps.subdomain.outputs.subdomain }}"
          DEPLOY_URL="https://pasay-cf-smoke.${SUB}.workers.dev"
          if ! grep -q "pasay-cf-smoke" "$GITHUB_WORKSPACE/wrangler-deploy.log"; then
            echo "::error::deploy output did not mention pasay-cf-smoke"
            cat "$GITHUB_WORKSPACE/wrangler-deploy.log"
            exit 1
          fi
          echo "DEPLOY_URL=$DEPLOY_URL" >> "$GITHUB_ENV"
          echo "Deployed Worker URL: $DEPLOY_URL"
          {
            echo "### PASay CF smoke deploy"
            echo "- Worker name: pasay-cf-smoke"
            echo "- Cloudflare account id: $ACC"
            echo "- workers.dev subdomain: $SUB"
            echo "- Public URL: $DEPLOY_URL"
            echo "- Public /health endpoint: $DEPLOY_URL/health"
            echo "- Run id: $GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Probe smoke endpoint
        if: env.DEPLOY_URL != ''
        run: |
          set -eo pipefail
          echo "Probing $DEPLOY_URL/health"
          STATUS=$(curl -s -o /tmp/health.out -w "%{http_code}" "$DEPLOY_URL/health")
          BODY=$(cat /tmp/health.out)
          echo "GET $DEPLOY_URL/health -> $STATUS"
          echo "body: $BODY"
          if [ "$STATUS" != "200" ] || [ "$BODY" != "PASAY_CF_SMOKE_OK" ]; then
            echo "::error::Smoke probe FAILED (expected 200 + PASAY_CF_SMOKE_OK)" >&2
            exit 1
          fi
          echo "Smoke probe OK"
