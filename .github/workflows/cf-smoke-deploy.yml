name: cf-smoke-deploy

# PASAY-CLOUDFLARE-ENV-001 deployment-readiness CI.
#
# This workflow only deploys the ISOLATED smoke Worker in `cf-smoke/`.
# It does NOT touch FastAPI / Telegram bot / Postgres / production routes.
#
# Required GitHub Actions secrets (Owner-bound):
#   CLOUDFLARE_API_TOKEN  - scoped to Workers Scripts:Edit on the smoke account
#   CLOUDFLARE_ACCOUNT_ID - the smoke Cloudflare account id (optional helper;
#                           when bound but malformed we discover the real ID
#                           from the API token via Cloudflare /accounts.)
#
# Push to `codex/pasay-cf-env-001` triggers dry-run only; deploy is gated to
# `workflow_dispatch` so real-account deploys are always Owner-initiated.

on:
  workflow_dispatch:
  push:
    branches:
      - codex/pasay-cf-env-001
    paths:
      - "cf-smoke/**"
      - ".github/workflows/cf-smoke-deploy.yml"

concurrency:
  group: cf-smoke-deploy
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cf-smoke
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler + jq
        run: |
          npm install --no-save wrangler@^4.123.0
          sudo apt-get update -y >/dev/null 2>&1 || true
          sudo apt-get install -y jq >/dev/null 2>&1 || apt-get install -y jq || true
          command -v jq && jq --version

      - name: Resolve Cloudflare account id
        id: account
        run: |
          set -euo pipefail
          BOUND_RAW="$CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$BOUND_RAW" ]; then
            CLEAN=$(printf '%s' "$BOUND_RAW" | tr -d '\r\n' | sed -E 's/^["'"'"']+|["'"'"']+$//g' | xargs)
            if printf '%s' "$CLEAN" | grep -Eq '^[A-Za-z0-9_-]+$'; then
              echo "Using sanitized CLOUDFLARE_ACCOUNT_ID (len=${#CLEAN})"
              echo "account_id=$CLEAN" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::bound CLOUDFLARE_ACCOUNT_ID was malformed (raw len=${#BOUND_RAW}, clean len=${#CLEAN}); falling back to /accounts discovery"
          else
            echo "CLOUDFLARE_ACCOUNT_ID not bound; discovering from API token"
          fi
          ACCOUNTS_JSON=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=1")
          if ! printf '%s' "$ACCOUNTS_JSON" | grep -q '"success":true'; then
            echo "::error::Cloudflare /accounts call failed:"
            printf '%s\n' "$ACCOUNTS_JSON"
            exit 1
          fi
          ACC_ID=$(printf '%s' "$ACCOUNTS_JSON" | jq -r '.result[0].id // empty')
          if [ -z "$ACC_ID" ]; then
            echo "::error::could not parse account id from /accounts response"
            exit 1
          fi
          echo "Discovered account_id via /accounts (len=${#ACC_ID})"
          echo "account_id=$ACC_ID" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Ensure workers.dev subdomain registered
        id: subdomain
        run: |
          set -euo pipefail
          ACC="${{ steps.account.outputs.account_id }}"
          HDR=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          GET=$(curl -sS "${HDR[@]}" "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/subdomain")
          SUBDOMAIN=$(printf '%s' "$GET" | jq -r '.result.subdomain // empty')
          if [ -n "$SUBDOMAIN" ]; then
            echo "workers.dev subdomain already registered (len=${#SUBDOMAIN})"
            echo "subdomain=$SUBDOMAIN" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::notice::no workers.dev subdomain yet; registering via API"
          PUT=$(curl -sS -X PUT "${HDR[@]}" -H "Content-Type: application/json" \
            --data '{"subdomain":"'"$ACC"'"}' \
            "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/subdomain")
          if ! printf '%s' "$PUT" | jq -e '.success == true' >/dev/null; then
            echo "::error::failed to register workers.dev subdomain"
            printf '%s\n' "$PUT"
            exit 1
          fi
          SUBDOMAIN=$(printf '%s' "$PUT" | jq -r '.result.subdomain // empty')
          if [ -z "$SUBDOMAIN" ]; then
            echo "::error::could not parse subdomain from PUT response"
            exit 1
          fi
          echo "Registered workers.dev subdomain (len=${#SUBDOMAIN})"
          echo "subdomain=$SUBDOMAIN" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Dry-run compile (always)
        run: npx wrangler deploy -c wrangler.toml --dry-run --env=""
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.account_id }}

      - name: Deploy smoke Worker (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          npx wrangler deploy -c wrangler.toml --env="" 2>&1 | tee "$GITHUB_WORKSPACE/wrangler-deploy.log"
          # GitHub secret masking rewrites arbitrary values to *** in the log,
          # so we cannot rely on the rendered wrangler URL. Re-derive the URL
          # from the account id + subdomain output of the earlier step; both
          # of those are written through $GITHUB_OUTPUT and are NOT masked
          # because they never appear in any secret binding.
          ACC="${{ steps.account.outputs.account_id }}"
          SUB="${{ steps.subdomain.outputs.subdomain }}"
          DEPLOY_URL="https://pasay-cf-smoke.${SUB}.workers.dev"
          # Confirm wrangler actually printed this URL in its log.
          if ! grep -q "$DEPLOY_URL" "$GITHUB_WORKSPACE/wrangler-deploy.log" && \
             ! grep -q "pasay-cf-smoke.\*\*\*.workers.dev" "$GITHUB_WORKSPACE/wrangler-deploy.log"; then
            echo "::error::expected deploy URL not found in wrangler output"
            cat "$GITHUB_WORKSPACE/wrangler-deploy.log"
            exit 1
          fi
          echo "DEPLOY_URL=$DEPLOY_URL" >> "$GITHUB_ENV"
          echo "Deployed Worker URL: $DEPLOY_URL"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.account_id }}

      - name: Probe smoke endpoint
        if: github.event_name == 'workflow_dispatch' && env.DEPLOY_URL != ''
        run: |
          set -euo pipefail
          echo "Probing $DEPLOY_URL/health"
          STATUS=$(curl -s -o /tmp/health.out -w "%{http_code}" "$DEPLOY_URL/health")
          BODY=$(cat /tmp/health.out)
          echo "GET $DEPLOY_URL/health -> $STATUS"
          echo "body: $BODY"
          if [ "$STATUS" != "200" ] || [ "$BODY" != "PASAY_CF_SMOKE_OK" ]; then
            echo "::error::Smoke probe FAILED (expected 200 + PASAY_CF_SMOKE_OK)" >&2
            exit 1
          fi
          echo "Smoke probe OK"
