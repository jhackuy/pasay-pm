name: opencode-native-qual

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [feature/telegram-ui-v2]
    paths:
      - opencode.json
      - .github/workflows/opencode-native-qual.yml

concurrency:
  group: opencode-native-qual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-qualification:
    if: github.head_ref == 'chore/pasay-oc-qual-001' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout qualification branch without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Record immutable run identity
        shell: bash
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          mkdir -p .opencode-qualification/evidence
          printf '%s\n' "MERGE_HEAD=$(git rev-parse HEAD)" | tee .opencode-qualification/evidence/identity.txt
          printf '%s\n' "PR_HEAD=${PR_HEAD}" | tee -a .opencode-qualification/evidence/identity.txt
          printf '%s\n' "BASE=${BASE_REF}" | tee -a .opencode-qualification/evidence/identity.txt
          printf '%s\n' "HEAD_REF=${HEAD_REF}" | tee -a .opencode-qualification/evidence/identity.txt
          printf '%s\n' "MODEL=minimax/MiniMax-M3" | tee -a .opencode-qualification/evidence/identity.txt

      - name: Install verified OpenCode V1 runtime
        shell: bash
        env:
          OPENCODE_VERSION: '1.18.24'
          OPENCODE_ASSET_SHA256: '573e48cd095670bf87dd834442077800b4bc979d0ad7d8b19802ec2b73e90c54'
        run: |
          set -euo pipefail
          archive="/tmp/opencode-linux-x64.tar.gz"
          dist="/tmp/opencode-dist"
          curl -fsSL "https://github.com/anomalyco/opencode/releases/download/v${OPENCODE_VERSION}/opencode-linux-x64.tar.gz" -o "$archive"
          printf '%s  %s\n' "$OPENCODE_ASSET_SHA256" "$archive" | sha256sum -c -
          rm -rf "$dist"
          mkdir -p "$dist" "$HOME/.opencode/bin"
          tar -xzf "$archive" -C "$dist"
          bin="$(find "$dist" -type f -name opencode -print -quit)"
          test -n "$bin"
          install -m 0755 "$bin" "$HOME/.opencode/bin/opencode"
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          "$HOME/.opencode/bin/opencode" --version | tee .opencode-qualification/evidence/runtime-version.txt
          test "$("$HOME/.opencode/bin/opencode" --version | tr -d '[:space:]')" = "$OPENCODE_VERSION"
          printf '%s\n' "ASSET=opencode-linux-x64.tar.gz" "SHA256=${OPENCODE_ASSET_SHA256}" | tee .opencode-qualification/evidence/runtime-asset.txt

      - name: Prove missing-provider-secret fails closed at runtime
        shell: bash
        env:
          MINIMAX_API_KEY: ''
        run: |
          set -euo pipefail
          test -z "${MINIMAX_API_KEY:-}"
          set +e
          timeout 30 opencode run \
            --agent pasay-lead \
            --model minimax/MiniMax-M3 \
            --format json \
            --title PASAY-OC-QUAL-MISSING-SECRET \
            "Return exactly MISSING_SECRET_NEGATIVE_PROBE without delegating." \
            > .opencode-qualification/evidence/missing-secret-negative.log 2>&1
          rc=$?
          set -e
          cat .opencode-qualification/evidence/missing-secret-negative.log
          if [ "$rc" -eq 0 ]; then
            echo 'NEGATIVE_FAIL: OpenCode unexpectedly succeeded with empty MINIMAX_API_KEY' >&2
            exit 1
          fi
          echo "NEGATIVE_PASS: OpenCode rejected empty MINIMAX_API_KEY rc=$rc" | tee .opencode-qualification/evidence/missing-secret-negative.txt

      - name: Verify effective config and exact agent catalog
        shell: bash
        run: |
          set -euo pipefail
          opencode debug config > .opencode-qualification/evidence/debug-config.json
          for agent in pasay-lead explore pasay-researcher pasay-implementer; do
            opencode debug agent "$agent" > ".opencode-qualification/evidence/agent-${agent}.json"
            test -s ".opencode-qualification/evidence/agent-${agent}.json"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path('.opencode-qualification/evidence/debug-config.json').read_text())
          assert cfg.get('share') == 'disabled', cfg.get('share')
          assert cfg.get('subagent_depth') == 1, cfg.get('subagent_depth')
          plugins = cfg.get('plugin') or []
          assert not any('superpowers' in str(x).lower() for x in plugins), plugins
          agents = cfg.get('agent') or {}
          lead = agents['pasay-lead']
          explore = agents['explore']
          researcher = agents['pasay-researcher']
          impl = agents['pasay-implementer']
          assert lead.get('mode') == 'primary'
          assert lead.get('model') == 'minimax/MiniMax-M3'
          assert lead.get('steps') == 12
          assert (lead.get('permission') or {}).get('edit') == 'deny'
          assert (lead.get('permission') or {}).get('bash') == 'deny'
          assert explore.get('mode') == 'subagent'
          assert explore.get('model') == 'minimax/MiniMax-M3'
          assert explore.get('steps') == 6
          assert researcher.get('mode') == 'subagent'
          assert researcher.get('model') == 'minimax/MiniMax-M3'
          assert researcher.get('steps') == 8
          assert impl.get('mode') == 'subagent'
          assert impl.get('model') == 'minimax/MiniMax-M3'
          assert impl.get('steps') == 8
          task = (lead.get('permission') or {}).get('task')
          assert task == {'*': 'deny', 'explore': 'allow', 'pasay-researcher': 'allow', 'pasay-implementer': 'allow'}, task
          for name in ('explore', 'pasay-researcher', 'pasay-implementer'):
              assert (agents[name].get('permission') or {}).get('task') == 'deny', (name, agents[name].get('permission'))
          assert (explore.get('permission') or {}).get('edit') == 'deny'
          assert (explore.get('permission') or {}).get('bash') == 'deny'
          assert (researcher.get('permission') or {}).get('edit') == 'deny'
          assert (researcher.get('permission') or {}).get('bash') == 'deny'
          assert (impl.get('permission') or {}).get('edit') == 'allow'
          assert (impl.get('permission') or {}).get('bash') == 'deny'
          Path('.opencode-qualification/evidence/effective-config-check.txt').write_text('PASS\n')
          PY

      - name: Capture pre-agent filesystem baseline
        shell: bash
        run: |
          set -euo pipefail
          rm -f .opencode-qualification/native-positive.txt
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path('.')
          excluded_roots = {'.git', '.opencode-qualification'}
          snapshot = {}
          for current, dirs, files in os.walk(root, topdown=True, followlinks=False):
              rel_dir = Path(current).relative_to(root)
              if rel_dir == Path('.'):
                  dirs[:] = [d for d in dirs if d not in excluded_roots]
              for d in dirs:
                  p = Path(current) / d
                  rel = p.relative_to(root).as_posix()
                  if p.is_symlink():
                      snapshot[rel] = {'type': 'symlink-dir', 'target': os.readlink(p)}
                  else:
                      snapshot[rel] = {'type': 'dir'}
              for f in files:
                  p = Path(current) / f
                  rel = p.relative_to(root).as_posix()
                  if p.is_symlink():
                      snapshot[rel] = {'type': 'symlink', 'target': os.readlink(p)}
                  else:
                      h = hashlib.sha256()
                      with p.open('rb') as fh:
                          for chunk in iter(lambda: fh.read(1024 * 1024), b''):
                              h.update(chunk)
                      snapshot[rel] = {'type': 'file', 'sha256': h.hexdigest(), 'size': p.stat().st_size}
          Path('.opencode-qualification/evidence/pre-agent-tree.json').write_text(json.dumps(snapshot, sort_keys=True, indent=2) + '\n')
          PY

      - name: Run Native Lead to Explore Researcher Implementer
        shell: bash
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${MINIMAX_API_KEY:-}"
          timeout 600 opencode run \
            --agent pasay-lead \
            --model minimax/MiniMax-M3 \
            --format json \
            --title PASAY-OC-QUAL-001 \
            "Qualification only. Complete exactly three delegations in this exact order and make no other task calls: (1) explore inspects repository opencode.json and reports share, subagent_depth, and whether a Superpowers plugin entry exists; (2) pasay-researcher inspects official OpenCode v1.18.24 release source/docs and reports the runtime built-in subagents and any docs/runtime mismatch; (3) pasay-implementer exactly once creates .opencode-qualification/native-positive.txt whose visible text is exactly: QUALIFICATION=PASS_CANDIDATE, EXPLORE_USED=true, RESEARCHER_USED=true, IMPLEMENTER_USED=true, SHARE=disabled, SUPERPOWERS_PLUGIN=absent. Do not include the two literal characters backslash+n in the file. A normal optional final LF is acceptable. Do not retry any delegation, do not use general, and do not edit any other file." \
            | tee .opencode-qualification/evidence/events.jsonl

      - name: Machine-verify exact completed child task sequence and output
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('.opencode-qualification/evidence/events.jsonl')
          task_sequence = []
          for raw in p.read_text().splitlines():
              try:
                  event = json.loads(raw)
              except json.JSONDecodeError:
                  continue
              if event.get('type') != 'tool_use':
                  continue
              part = event.get('part') or {}
              if part.get('tool') != 'task':
                  continue
              state = part.get('state') or {}
              subagent = ((state.get('input') or {}).get('subagent_type') or '').lower()
              status = (state.get('status') or '').lower()
              task_sequence.append((subagent, status))
          expected_sequence = [
              ('explore', 'completed'),
              ('pasay-researcher', 'completed'),
              ('pasay-implementer', 'completed'),
          ]
          assert task_sequence == expected_sequence, f'task sequence/status={task_sequence}'
          Path('.opencode-qualification/evidence/task-call-check.txt').write_text('PASS ' + json.dumps(task_sequence) + '\n')

          output = Path('.opencode-qualification/native-positive.txt')
          assert output.is_file(), 'qualification output was not created by the Agent run'
          expected = (
              b'QUALIFICATION=PASS_CANDIDATE, EXPLORE_USED=true, RESEARCHER_USED=true, '
              b'IMPLEMENTER_USED=true, SHARE=disabled, SUPERPOWERS_PLUGIN=absent'
          )
          actual = output.read_bytes()
          assert actual in (expected, expected + b'\n'), f'qualification output mismatch: {actual!r}'
          assert b'\\n' not in actual, f'literal backslash-n is forbidden: {actual!r}'
          Path('.opencode-qualification/evidence/output-content-check.txt').write_text('PASS\n')
          PY
          cat .opencode-qualification/native-positive.txt

      - name: Enforce Agent write-scope guard including ignored files
        shell: bash
        run: |
          set -euo pipefail
          git status --porcelain --untracked-files=all | tee .opencode-qualification/evidence/git-status.txt
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path('.')
          excluded_roots = {'.git', '.opencode-qualification'}
          before = json.loads(Path('.opencode-qualification/evidence/pre-agent-tree.json').read_text())
          after = {}
          for current, dirs, files in os.walk(root, topdown=True, followlinks=False):
              rel_dir = Path(current).relative_to(root)
              if rel_dir == Path('.'):
                  dirs[:] = [d for d in dirs if d not in excluded_roots]
              for d in dirs:
                  p = Path(current) / d
                  rel = p.relative_to(root).as_posix()
                  if p.is_symlink():
                      after[rel] = {'type': 'symlink-dir', 'target': os.readlink(p)}
                  else:
                      after[rel] = {'type': 'dir'}
              for f in files:
                  p = Path(current) / f
                  rel = p.relative_to(root).as_posix()
                  if p.is_symlink():
                      after[rel] = {'type': 'symlink', 'target': os.readlink(p)}
                  else:
                      h = hashlib.sha256()
                      with p.open('rb') as fh:
                          for chunk in iter(lambda: fh.read(1024 * 1024), b''):
                              h.update(chunk)
                      after[rel] = {'type': 'file', 'sha256': h.hexdigest(), 'size': p.stat().st_size}
          added = sorted(set(after) - set(before))
          removed = sorted(set(before) - set(after))
          changed = sorted(k for k in set(before) & set(after) if before[k] != after[k])
          diff = {'added': added, 'removed': removed, 'changed': changed}
          Path('.opencode-qualification/evidence/filesystem-diff.json').write_text(json.dumps(diff, sort_keys=True, indent=2) + '\n')
          assert not added and not removed and not changed, f'Agent changed forbidden paths outside .opencode-qualification/: {diff}'
          Path('.opencode-qualification/evidence/path-guard.txt').write_text('PASS\n')
          PY

      - name: Prove OpenCode runtime has no GitHub push identity
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test -n "${DEFAULT_BRANCH:-}"
          remote="$(git remote get-url origin)"
          printf '%s\n' "REMOTE=${remote}" "DEFAULT_BRANCH=${DEFAULT_BRANCH}" | tee .opencode-qualification/evidence/push-identity-preflight.txt
          test "$remote" = 'https://github.com/jhackuy/pasay-pm'
          if git config --local --get-regexp '^http\..*\.extraheader$' >> .opencode-qualification/evidence/push-identity-preflight.txt 2>&1; then
            echo 'NEGATIVE_FAIL: checkout left a local HTTP authorization extraheader' >&2
            exit 1
          fi
          set +e
          GIT_TERMINAL_PROMPT=0 git push --dry-run origin "HEAD:refs/heads/${DEFAULT_BRANCH}" \
            > .opencode-qualification/evidence/default-push-negative.stdout \
            2> .opencode-qualification/evidence/default-push-negative.stderr
          rc=$?
          set -e
          cat .opencode-qualification/evidence/default-push-negative.stderr
          if [ "$rc" -eq 0 ]; then
            echo 'NEGATIVE_FAIL: dry-run default branch push unexpectedly authenticated' >&2
            exit 1
          fi
          if ! grep -Eqi 'could not read (Username|Password)|authentication failed|terminal prompts disabled|could not authenticate|permission denied' .opencode-qualification/evidence/default-push-negative.stderr; then
            echo 'NEGATIVE_FAIL: push failed, but not for an identity/authentication reason' >&2
            exit 1
          fi
          echo "NEGATIVE_PASS: dry-run push to ${DEFAULT_BRANCH} rejected for missing identity rc=$rc" | tee .opencode-qualification/evidence/default-push-negative.txt

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pasay-opencode-native-qual-evidence
          path: .opencode-qualification/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
