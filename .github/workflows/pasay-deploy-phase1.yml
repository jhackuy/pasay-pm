      # ═══════════════════════════════════════════════════════════════════
      - name: STEP 7 — Bootstrap Production Identity (Owner + Sec1) — Idempotent (NO secrets/IDs printed)
        if: inputs.step78910_owner_bootstrap_and_tg_smoke
