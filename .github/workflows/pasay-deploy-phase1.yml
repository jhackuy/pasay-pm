          echo ""
          echo "─── INTERNAL_SYNTHETIC_E2E = PASS ───"
          echo "  (Worker→Queue→Container→PTB→handler→Neon truth chain      "
          echo "  state=done + processed_at IS NOT NULL + last_error=NULL verified)"
          echo "  new unique update_id (Neon evidence above STEP9.3)"
          echo "  idempotency replay: second POST → count still 1"
          echo ""
          echo "─── REAL_TELEGRAM_SERVER_DELIVERY = NOT_YET_VERIFIED ───"
          echo "  Internal synthetic POST only. Next step: Owner real Telegram"
