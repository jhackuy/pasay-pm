# PASAY Mini App — Cloudflare Pages deploy configuration (Issue #119).
#
# The trusted deploy lane builds mini_app/dist explicitly, then publishes
# that directory with `wrangler pages deploy dist --project-name=pasay-mini-app`.
# Keep this file limited to fields accepted by Wrangler for Pages projects.

name = "pasay-mini-app"
compatibility_date = "2026-08-20"
pages_build_output_dir = "dist"
